<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#ea580c" />
  <title>Easy Padhai — Offline Mode</title>
  <link rel="icon" href="/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --card-border: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #ea580c;
      --primary-hover: #c2410c;
      --secondary: #1e293b;
      --emerald: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    html, body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
      display: flex;
      flex-direction: column;
      padding-bottom: 40px;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(9, 13, 22, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: 12px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      max-width: 100vw;
      overflow-x: hidden;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
      text-decoration: none;
      color: var(--text);
      min-width: 0;
    }
    .brand img {
      width: 30px;
      height: 30px;
      border-radius: 8px;
      flex-shrink: 0;
    }
    .brand span {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.5px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(234, 88, 12, 0.15);
      border: 1px solid rgba(234, 88, 12, 0.4);
      color: #fb923c;
      padding: 4px 8px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      flex-shrink: 0;
    }
    .dot {
      width: 7px;
      height: 7px;
      background: #ea580c;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    main {
      flex: 1;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      overflow-x: hidden;
    }
    .hero-banner {
      background: linear-gradient(135deg, rgba(234, 88, 12, 0.15), rgba(245, 158, 11, 0.1));
      border: 1px solid rgba(234, 88, 12, 0.3);
      border-radius: 18px;
      padding: 14px 16px;
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      width: 100%;
      max-width: 100%;
    }
    .hero-title {
      font-size: 15px;
      font-weight: 700;
      color: var(--text);
    }
    .hero-desc {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
      line-height: 1.4;
    }
    .btn-reload {
      background: var(--secondary);
      color: var(--text);
      border: 1px solid var(--card-border);
      padding: 6px 12px;
      border-radius: 9999px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px;
      width: 100%;
      max-width: 100%;
      overflow: hidden;
    }
    .section-title {
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 10px;
    }
    .lesson-list {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 100%;
      max-width: 100%;
    }
    .lesson-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      background: var(--secondary);
      border: 1px solid transparent;
      border-radius: 14px;
      padding: 10px 12px;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
      max-width: 100%;
      min-width: 0;
    }
    .lesson-item:hover, .lesson-item.active {
      border-color: var(--primary);
      background: rgba(234, 88, 12, 0.12);
    }
    .lesson-info {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
      flex: 1;
      overflow: hidden;
    }
    .lesson-icon {
      width: 32px;
      height: 32px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      font-size: 14px;
      flex-shrink: 0;
    }
    .lesson-name {
      font-size: 13px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .lesson-sub {
      font-size: 10px;
      color: var(--text-muted);
      margin-top: 1px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .btn-play {
      background: var(--primary);
      color: #fff;
      border: none;
      width: 30px;
      height: 30px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      font-size: 12px;
    }
    /* Player Block */
    .player-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 18px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 14px;
      width: 100%;
      max-width: 100%;
      overflow: hidden;
    }
    .player-header {
      display: flex;
      flex-direction: column;
      gap: 4px;
      min-width: 0;
    }
    .player-title {
      font-size: 16px;
      font-weight: 700;
      word-break: break-word;
      line-height: 1.3;
    }
    .player-chapter {
      font-size: 11px;
      color: var(--text-muted);
      word-break: break-word;
    }
    audio {
      width: 100%;
      max-width: 100%;
      height: 44px;
      border-radius: 9999px;
      outline: none;
    }
    .summary-box {
      background: var(--secondary);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 14px 16px;
      font-size: 13px;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.92);
      word-break: break-word;
      max-height: 380px;
      overflow-y: auto;
    }
    .summary-box h1 {
      font-size: 16px;
      font-weight: 800;
      color: var(--primary);
      margin: 8px 0 6px 0;
      line-height: 1.3;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 4px;
    }
    .summary-box h2 {
      font-size: 14px;
      font-weight: 700;
      color: #fbbf24;
      margin: 12px 0 4px 0;
      line-height: 1.3;
    }
    .summary-box h3, .summary-box h4 {
      font-size: 13px;
      font-weight: 700;
      color: #38bdf8;
      margin: 10px 0 4px 0;
    }
    .summary-box p {
      margin: 6px 0;
    }
    .summary-box strong {
      color: #ffffff;
      font-weight: 700;
    }
    .summary-box em {
      color: rgba(255, 255, 255, 0.85);
      font-style: italic;
    }
    .summary-box ul {
      margin: 6px 0 8px 0;
      padding-left: 20px;
      list-style-type: disc;
    }
    .summary-box ol {
      margin: 6px 0 8px 0;
      padding-left: 20px;
      list-style-type: decimal;
    }
    .summary-box li {
      margin: 4px 0;
      line-height: 1.5;
    }
    .summary-box blockquote {
      border-left: 3px solid var(--primary);
      margin: 8px 0;
      padding: 4px 10px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 4px;
    }
    .summary-box hr {
      border: 0;
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
      margin: 12px 0;
    }
    /* KaTeX equation display offline */
    .summary-box .katex {
      font: normal 1.05em KaTeX_Main, Times New Roman, serif;
      line-height: 1.2;
      color: #f8fafc;
    }
    .summary-box .katex * {
      border-color: currentColor;
    }
    .summary-box .katex-display-wrapper {
      margin: 10px 0;
      overflow-x: auto;
      padding: 6px 0;
      text-align: center;
    }
    .summary-box .katex-display {
      display: block;
      margin: 0.5em 0;
      text-align: center;
    }
    .summary-box .katex .base {
      position: relative;
      display: inline-block;
      white-space: nowrap;
      width: min-content;
    }
    .summary-box .katex .strut {
      display: inline-block;
    }
    .summary-box .katex .mord, .summary-box .katex .minner {
      display: inline-block;
    }
    .summary-box .katex .mbin {
      display: inline-block;
      margin: 0 0.22em;
    }
    .summary-box .katex .mrel {
      display: inline-block;
      margin: 0 0.27em;
    }
    .summary-box .katex .mfrac {
      display: inline-block;
      vertical-align: -0.09em;
      text-align: center;
    }
    .summary-box .katex .mfrac > span > span {
      display: block;
    }
    .summary-box .katex .frac-line {
      display: block;
      border-bottom: 0.04em solid;
      margin: 0.04em 0;
    }
    .summary-box .katex .vlist-t {
      display: inline-table;
      table-layout: fixed;
      border-collapse: collapse;
    }
    .summary-box .katex .vlist-r {
      display: table-row;
    }
    .summary-box .katex .vlist {
      display: table-cell;
      vertical-align: bottom;
      position: relative;
    }
    .summary-box .katex .vlist > span {
      display: block;
      height: 0;
      position: relative;
    }
    .summary-box .katex .vlist > span > span {
      display: inline-block;
    }
    .summary-box .katex .msupsub {
      text-align: left;
    }
    .summary-box .katex .sqrt > .vlist-t {
      border-top: 0.04em solid;
    }
    .empty-state {
      text-align: center;
      padding: 30px 10px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      width: 100%;
    }
    .empty-icon {
      font-size: 36px;
      margin-bottom: 2px;
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 10px 20px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      margin-top: 6px;
    }
  </style>
</head>
<body>
  <header>
    <a href="/" class="brand">
      <img src="/easy-padhai-mark.png" alt="Easy Padhai" />
      <span>Easy Padhai</span>
    </a>
    <div class="status-badge">
      <span class="dot"></span>
      <span>Offline Mode</span>
    </div>
  </header>

  <main>
    <div class="hero-banner">
      <div style="min-width: 0; flex: 1;">
        <p class="hero-title">⚡ 100% Zero-Data Offline Study</p>
        <p class="hero-desc">Listening directly from in-app offline storage.</p>
      </div>
      <button class="btn-reload" onclick="window.location.reload()">Check Net 🔄</button>
    </div>

    <!-- Active Player Box -->
    <div id="player-container" style="display: none;" class="player-box">
      <div class="player-header">
        <span class="status-badge" style="width: fit-content;">🎧 Offline Audio Lecture</span>
        <h2 id="now-playing-title" class="player-title">Lesson Title</h2>
        <p id="now-playing-chapter" class="player-chapter">Chapter Name</p>
      </div>

      <audio id="audio-element" controls controlsList="nodownload" playsinline></audio>

      <div id="summary-section" style="display: none;">
        <p class="section-title">📝 Quick Summary & Notes</p>
        <div id="summary-content" class="summary-box"></div>
      </div>
    </div>

    <!-- Downloaded List -->
    <div class="card">
      <p class="section-title" id="list-count-title">Downloaded Lectures</p>
      <div id="lesson-list-container" class="lesson-list">
        <p style="text-align: center; color: var(--text-muted); padding: 20px;">Loading your offline downloads…</p>
      </div>
    </div>
  </main>

  <script>
    const DB_NAME = "EasyPadhaiOfflineDB";
    const DB_VERSION = 2;
    const STORE_NAME = "offline_lessons";

    function openOfflineDB() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) {
          reject(new Error("IndexedDB not supported"));
          return;
        }
        const request = window.indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: "id" });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function loadOfflineLessons() {
      const container = document.getElementById("lesson-list-container");
      const countTitle = document.getElementById("list-count-title");
      try {
        const db = await openOfflineDB();
        const tx = db.transaction(STORE_NAME, "readonly");
        const store = tx.objectStore(STORE_NAME);
        const req = store.getAll();

        req.onsuccess = () => {
          const lessons = req.result || [];
          if (lessons.length === 0) {
            countTitle.innerText = "Downloaded Lectures (0)";
            container.innerHTML = `
              <div class="empty-state">
                <div class="empty-icon">📥</div>
                <h3 style="font-size: 15px; font-weight: 700;">No downloaded lectures found</h3>
                <p style="font-size: 12px; color: var(--text-muted); max-width: 280px; line-height: 1.4;">
                  When connected to internet, tap <strong>"Download Offline"</strong> on any chapter lesson.
                </p>
                <button class="btn-primary" onclick="window.location.reload()">Retry Connection</button>
              </div>
            `;
            return;
          }

          countTitle.innerText = "Downloaded Lectures (" + lessons.length + ")";
          container.innerHTML = "";

          lessons.forEach((l, index) => {
            const item = document.createElement("div");
            item.className = "lesson-item" + (index === 0 ? " active" : "");
            item.onclick = () => playOfflineLesson(l, item);

            item.innerHTML = `
              <div class="lesson-info">
                <div class="lesson-icon">🎧</div>
                <div style="min-width: 0; flex: 1;">
                  <p class="lesson-name">${l.title}</p>
                  <p class="lesson-sub">${l.chapter_title || "Offline Lecture"} · ~${l.duration_minutes || 10}m</p>
                </div>
              </div>
              <button class="btn-play" title="Play">▶</button>
            `;
            container.appendChild(item);
          });

          // Auto-load first lesson in player
          if (lessons.length > 0) {
            playOfflineLesson(lessons[0]);
          }
        };
      } catch (err) {
        container.innerHTML = `<p style="text-align: center; color: var(--text-muted); padding: 20px;">Could not read offline storage.</p>`;
      }
    }

    let currentBlobUrl = null;

    function parseSmartMarkdown(text) {
      if (!text) return "";
      // Escape HTML special characters
      let s = text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");

      // Math symbol replacements for offline fallback if uncompiled LaTeX is present
      s = s.replace(/\\Omega/g, "Ω")
           .replace(/\\Delta/g, "Δ")
           .replace(/\\pi/g, "π")
           .replace(/\\mu/g, "μ")
           .replace(/\\alpha/g, "α")
           .replace(/\\beta/g, "β")
           .replace(/\\theta/g, "θ")
           .replace(/\\lambda/g, "λ")
           .replace(/\\approx/g, "≈")
           .replace(/\\neq/g, "≠")
           .replace(/\\le/g, "≤")
           .replace(/\\ge/g, "≥")
           .replace(/\\times/g, "×")
           .replace(/\\div/g, "÷")
           .replace(/\\pm/g, "±")
           .replace(/\\infty/g, "∞")
           .replace(/\\rightarrow/g, "→")
           .replace(/\\leftarrow/g, "←");

      // Handle simple $...$ inline math by stripping $ and italicizing
      s = s.replace(/\$([^\$\n]+)\$/g, "<em>$1</em>");

      // Markdown Headings
      s = s.replace(/^### (.*$)/gim, "<h3>$1</h3>");
      s = s.replace(/^## (.*$)/gim, "<h2>$1</h2>");
      s = s.replace(/^# (.*$)/gim, "<h1>$1</h1>");

      // Bold & Italic
      s = s.replace(/\*\*(.*?)\*\*/gim, "<strong>$1</strong>");
      s = s.replace(/\*(.*?)\*/gim, "<em>$1</em>");

      // Inline code
      s = s.replace(/`([^`]+)`/g, "<code>$1</code>");

      // Unordered & Ordered List Items
      s = s.replace(/(^|\n)[*-] (.*)/g, "$1<li>$2</li>");
      s = s.replace(/(^|\n)\d+\. (.*)/g, "$1<li>$2</li>");

      // Wrap contiguous <li> with <ul>
      s = s.replace(/((?:<li>.*?<\/li>\s*)+)/gs, "<ul>$1</ul>");

      // Paragraphs and breaks
      s = s.replace(/\n\n+/g, "<br/><br/>");
      s = s.replace(/\n/g, "<br/>");

      // Clean up extra line breaks next to headers and lists
      s = s.replace(/<\/h[1-3]><br\/>/g, (m) => m.replace("<br/>", ""));
      s = s.replace(/<\/ul><br\/>/g, "</ul>");

      return s;
    }

    function playOfflineLesson(lesson, clickedItem) {
      if (clickedItem) {
        document.querySelectorAll(".lesson-item").forEach(el => el.classList.remove("active"));
        clickedItem.classList.add("active");
      }

      const playerContainer = document.getElementById("player-container");
      const titleEl = document.getElementById("now-playing-title");
      const chapterEl = document.getElementById("now-playing-chapter");
      const audioEl = document.getElementById("audio-element");
      const summarySection = document.getElementById("summary-section");
      const summaryContent = document.getElementById("summary-content");

      playerContainer.style.display = "flex";
      titleEl.innerText = lesson.title;
      chapterEl.innerText = lesson.chapter_title || "Offline Lecture";

      if (currentBlobUrl) {
        URL.revokeObjectURL(currentBlobUrl);
      }

      if (lesson.audio_blob) {
        currentBlobUrl = URL.createObjectURL(lesson.audio_blob);
        audioEl.src = currentBlobUrl;
        audioEl.style.display = "block";
        audioEl.play().catch(() => {});
      } else {
        audioEl.style.display = "none";
      }

      if (lesson.html_summary) {
        summarySection.style.display = "block";
        summaryContent.innerHTML = lesson.html_summary;
      } else if (lesson.summary) {
        summarySection.style.display = "block";
        summaryContent.innerHTML = parseSmartMarkdown(lesson.summary);
      } else {
        summarySection.style.display = "none";
      }

      playerContainer.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    // Auto-reload when user turns Wi-Fi / mobile internet back on
    window.addEventListener("online", () => {
      window.location.reload();
    });

    document.addEventListener("DOMContentLoaded", loadOfflineLessons);
  </script>
</body>
</html>
