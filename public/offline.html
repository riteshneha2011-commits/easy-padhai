<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <meta name="theme-color" content="#ea580c" />
  <title>Easy Padhai — Offline Mode</title>
  <link rel="icon" href="/favicon.png" type="image/png" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <style>
    :root {
      --bg: #090d16;
      --card-bg: #131b2e;
      --card-border: #1e293b;
      --text: #f8fafc;
      --text-muted: #94a3b8;
      --primary: #ea580c;
      --primary-hover: #c2410c;
      --secondary: #1e293b;
      --emerald: #10b981;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 40px;
    }
    header {
      position: sticky;
      top: 0;
      z-index: 30;
      background: rgba(9, 13, 22, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--card-border);
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      text-decoration: none;
      color: var(--text);
    }
    .brand img {
      width: 32px;
      height: 32px;
      border-radius: 8px;
    }
    .brand span {
      font-size: 18px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      background: rgba(234, 88, 12, 0.15);
      border: 1px solid rgba(234, 88, 12, 0.4);
      color: #fb923c;
      padding: 4px 10px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
    }
    .dot {
      width: 8px;
      height: 8px;
      background: #ea580c;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    main {
      flex: 1;
      max-width: 800px;
      width: 100%;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .hero-banner {
      background: linear-gradient(135deg, rgba(234, 88, 12, 0.15), rgba(245, 158, 11, 0.1));
      border: 1px solid rgba(234, 88, 12, 0.3);
      border-radius: 20px;
      padding: 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .hero-title {
      font-size: 16px;
      font-weight: 700;
      color: var(--text);
    }
    .hero-desc {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 2px;
    }
    .btn-reload {
      background: var(--secondary);
      color: var(--text);
      border: 1px solid var(--card-border);
      padding: 8px 14px;
      border-radius: 9999px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
    }
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 18px;
    }
    .section-title {
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      color: var(--text-muted);
      margin-bottom: 12px;
    }
    .lesson-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .lesson-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      background: var(--secondary);
      border: 1px solid transparent;
      border-radius: 16px;
      padding: 12px 16px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .lesson-item:hover, .lesson-item.active {
      border-color: var(--primary);
      background: rgba(234, 88, 12, 0.12);
    }
    .lesson-info {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
      flex: 1;
    }
    .lesson-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--primary);
      font-size: 16px;
      flex-shrink: 0;
    }
    .lesson-name {
      font-size: 14px;
      font-weight: 600;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .lesson-sub {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }
    .btn-play {
      background: var(--primary);
      color: #fff;
      border: none;
      width: 34px;
      height: 34px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      flex-shrink: 0;
      font-size: 14px;
    }
    /* Player Block */
    .player-box {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .player-header {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .player-title {
      font-size: 18px;
      font-weight: 700;
    }
    .player-chapter {
      font-size: 12px;
      color: var(--text-muted);
    }
    audio {
      width: 100%;
      height: 48px;
      border-radius: 9999px;
      outline: none;
    }
    .summary-box {
      background: var(--secondary);
      border-radius: 14px;
      padding: 14px;
      font-size: 14px;
      line-height: 1.6;
      color: rgba(255, 255, 255, 0.9);
      white-space: pre-wrap;
      max-height: 300px;
      overflow-y: auto;
    }
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }
    .empty-icon {
      font-size: 40px;
      margin-bottom: 4px;
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
      border: none;
      padding: 12px 24px;
      border-radius: 9999px;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <header>
    <a href="/" class="brand">
      <img src="/easy-padhai-mark.png" alt="Easy Padhai" />
      <span>Easy Padhai</span>
    </a>
    <div class="status-badge">
      <span class="dot"></span>
      <span>Offline Mode</span>
    </div>
  </header>

  <main>
    <div class="hero-banner">
      <div>
        <p class="hero-title">⚡ 100% Zero-Data Offline Study</p>
        <p class="hero-desc">You are listening directly from your in-app offline storage.</p>
      </div>
      <button class="btn-reload" onclick="window.location.reload()">Check Internet 🔄</button>
    </div>

    <!-- Active Player Box -->
    <div id="player-container" style="display: none;" class="player-box">
      <div class="player-header">
        <span class="status-badge" style="width: fit-content;">🎧 Offline Audio Lecture</span>
        <h2 id="now-playing-title" class="player-title">Lesson Title</h2>
        <p id="now-playing-chapter" class="player-chapter">Chapter Name</p>
      </div>

      <audio id="audio-element" controls controlsList="nodownload" playsinline></audio>

      <div id="summary-section" style="display: none;">
        <p class="section-title">📝 Quick Summary & Notes</p>
        <div id="summary-content" class="summary-box"></div>
      </div>
    </div>

    <!-- Downloaded List -->
    <div class="card">
      <p class="section-title" id="list-count-title">Downloaded Lectures</p>
      <div id="lesson-list-container" class="lesson-list">
        <p style="text-align: center; color: var(--text-muted); padding: 20px;">Loading your offline downloads…</p>
      </div>
    </div>
  </main>

  <script>
    const DB_NAME = "EasyPadhaiOfflineDB";
    const DB_VERSION = 2;
    const STORE_NAME = "offline_lessons";

    function openOfflineDB() {
      return new Promise((resolve, reject) => {
        if (!window.indexedDB) {
          reject(new Error("IndexedDB not supported"));
          return;
        }
        const request = window.indexedDB.open(DB_NAME, DB_VERSION);
        request.onupgradeneeded = (e) => {
          const db = e.target.result;
          if (!db.objectStoreNames.contains(STORE_NAME)) {
            db.createObjectStore(STORE_NAME, { keyPath: "id" });
          }
        };
        request.onsuccess = () => resolve(request.result);
        request.onerror = () => reject(request.error);
      });
    }

    async function loadOfflineLessons() {
      const container = document.getElementById("lesson-list-container");
      const countTitle = document.getElementById("list-count-title");
      try {
        const db = await openOfflineDB();
        const tx = db.transaction(STORE_NAME, "readonly");
        const store = tx.objectStore(STORE_NAME);
        const req = store.getAll();

        req.onsuccess = () => {
          const lessons = req.result || [];
          if (lessons.length === 0) {
            countTitle.innerText = "Downloaded Lectures (0)";
            container.innerHTML = `
              <div class="empty-state">
                <div class="empty-icon">📥</div>
                <h3 style="font-size: 16px; font-weight: 700;">No downloaded lectures found</h3>
                <p style="font-size: 13px; color: var(--text-muted); max-width: 320px;">
                  When connected to internet, tap <strong>"Download Offline"</strong> on any chapter lesson to listen without data.
                </p>
                <button class="btn-primary" onclick="window.location.reload()">Retry Connection</button>
              </div>
            `;
            return;
          }

          countTitle.innerText = "Downloaded Lectures (" + lessons.length + ")";
          container.innerHTML = "";

          lessons.forEach((l, index) => {
            const item = document.createElement("div");
            item.className = "lesson-item" + (index === 0 ? " active" : "");
            item.onclick = () => playOfflineLesson(l, item);

            item.innerHTML = `
              <div class="lesson-info">
                <div class="lesson-icon">🎧</div>
                <div style="min-width: 0;">
                  <p class="lesson-name">${l.title}</p>
                  <p class="lesson-sub">${l.chapter_title || "Offline Lecture"} · ~${l.duration_minutes || 10}m</p>
                </div>
              </div>
              <button class="btn-play" title="Play">▶</button>
            `;
            container.appendChild(item);
          });

          // Auto-load first lesson in player
          if (lessons.length > 0) {
            playOfflineLesson(lessons[0]);
          }
        };
      } catch (err) {
        container.innerHTML = `<p style="text-align: center; color: var(--text-muted); padding: 20px;">Could not read offline storage.</p>`;
      }
    }

    let currentBlobUrl = null;

    function playOfflineLesson(lesson, clickedItem) {
      if (clickedItem) {
        document.querySelectorAll(".lesson-item").forEach(el => el.classList.remove("active"));
        clickedItem.classList.add("active");
      }

      const playerContainer = document.getElementById("player-container");
      const titleEl = document.getElementById("now-playing-title");
      const chapterEl = document.getElementById("now-playing-chapter");
      const audioEl = document.getElementById("audio-element");
      const summarySection = document.getElementById("summary-section");
      const summaryContent = document.getElementById("summary-content");

      playerContainer.style.display = "flex";
      titleEl.innerText = lesson.title;
      chapterEl.innerText = lesson.chapter_title || "Offline Lecture";

      if (currentBlobUrl) {
        URL.revokeObjectURL(currentBlobUrl);
      }

      if (lesson.audio_blob) {
        currentBlobUrl = URL.createObjectURL(lesson.audio_blob);
        audioEl.src = currentBlobUrl;
        audioEl.style.display = "block";
        audioEl.play().catch(() => {});
      } else {
        audioEl.style.display = "none";
      }

      if (lesson.summary) {
        summarySection.style.display = "block";
        summaryContent.innerText = lesson.summary;
      } else {
        summarySection.style.display = "none";
      }

      playerContainer.scrollIntoView({ behavior: "smooth", block: "start" });
    }

    // Auto-reload when user turns Wi-Fi / mobile internet back on
    window.addEventListener("online", () => {
      window.location.reload();
    });

    document.addEventListener("DOMContentLoaded", loadOfflineLessons);
  </script>
</body>
</html>
